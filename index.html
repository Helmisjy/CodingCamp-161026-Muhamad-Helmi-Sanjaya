<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#667eea" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Life Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Font Awesome CDN -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Dark Mode Toggle -->
  <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">🌙</button>

  <!-- Name Modal (first visit) -->
  <div class="modal-overlay" id="nameModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal">
      <div class="modal-icon">👋</div>
      <h2 id="modalTitle">Welcome!</h2>
      <p>What should I call you?</p>
      <input
        type="text"
        id="nameInput"
        class="modal-input"
        placeholder="Enter your name..."
        maxlength="30"
        autocomplete="off"
      />
      <button class="btn btn-primary btn-full" id="saveNameBtn">Let's Go!</button>
    </div>
  </div>

  <div class="dashboard">

    <!-- Greeting Card -->
    <section class="card greeting-card" aria-label="Greeting">
      <div class="time-display" id="clock" aria-live="polite">00:00:00</div>
      <div class="date-display" id="dateDisplay"></div>
      <div class="greeting-text" id="greetingText">Good Morning!</div>
      <button class="change-name-btn" id="changeNameBtn" aria-label="Change your name"><i class="fa-solid fa-pen-to-square"></i> Change Name</button>
    </section>

    <!-- Middle Row -->
    <div class="middle-row">

      <!-- Focus Timer Card -->
      <section class="card timer-card" aria-label="Focus Timer">
        <h2 class="card-title">
          <span class="card-icon"><i class="fa-solid fa-stopwatch"></i></span> Focus Timer
        </h2>

        <!-- Duration setting -->
        <div class="timer-duration-row">
          <label for="timerDuration">Duration (min):</label>
          <div class="duration-controls">
            <button class="duration-btn" id="durationMinus" aria-label="Decrease duration">−</button>
            <input
              type="number"
              id="timerDuration"
              class="duration-input"
              value="25"
              min="1"
              max="120"
              aria-label="Timer duration in minutes"
            />
            <button class="duration-btn" id="durationPlus" aria-label="Increase duration">+</button>
          </div>
        </div>

        <div class="timer-display" id="timerDisplay" aria-live="polite">25:00</div>
        <div class="timer-status" id="timerStatus">Ready to focus <i class="fa-solid fa-location-crosshairs"></i></div>

        <div class="timer-buttons">
          <button class="btn btn-start" id="startBtn"><i class="fa-solid fa-play"></i> Start</button>
          <button class="btn btn-stop" id="stopBtn" disabled><i class="fa-solid fa-pause"></i> Pause</button>
          <button class="btn btn-reset" id="resetBtn"><i class="fa-solid fa-arrow-rotate-left"></i> Reset</button>
        </div>
      </section>

      <!-- Tasks Card -->
      <section class="card tasks-card" aria-label="To-Do List">
        <h2 class="card-title">
          <span class="card-icon"><i class="fa-solid fa-list-check"></i></span> Tasks
          <span class="task-counter" id="taskCounter">0 / 0</span>
        </h2>

        <div class="task-input-row">
          <input
            type="text"
            id="taskInput"
            class="task-input"
            placeholder="Add a new task..."
            maxlength="80"
            autocomplete="off"
          />
          <button class="btn btn-primary" id="addTaskBtn">Add</button>
        </div>
        <div class="task-error" id="taskError" role="alert" aria-live="polite"></div>

        <ul class="task-list" id="taskList" aria-label="Task list"></ul>

        <div class="task-empty" id="taskEmpty">
          <span>No tasks yet — add one above! 🌟</span>
        </div>
      </section>

    </div><!-- end middle-row -->

    <!-- Bottom Row -->
    <div class="bottom-row">

      <!-- Quick Links Card -->
      <section class="card links-card" aria-label="Quick Links">
        <h2 class="card-title">
          <span class="card-icon"><i class="fa-solid fa-link"></i></span> Quick Links
        </h2>

        <div class="link-input-row">
          <input
            type="text"
            id="linkName"
            class="link-input"
            placeholder="Link name"
            maxlength="30"
            autocomplete="off"
          />
          <input
            type="url"
            id="linkUrl"
            class="link-input link-input-url"
            placeholder="https://..."
            autocomplete="off"
          />
          <button class="btn btn-primary" id="addLinkBtn">Add Link</button>
        </div>
        <div class="link-error" id="linkError" role="alert" aria-live="polite"></div>

        <div class="links-grid" id="linksGrid">
          <div class="links-empty" id="linksEmpty">No links yet — add your favourites! 🌐</div>
        </div>
      </section>

      <!-- Daily Progress Card -->
      <section class="card progress-card" aria-label="Daily Progress">
        <h2 class="card-title">
          <span class="card-icon"><i class="fa-solid fa-chart-simple"></i></span> Daily Progress
        </h2>

        <!-- Percentage display -->
        <div class="progress-hero">
          <span class="progress-percent" id="progressPercent">0%</span>
          <span class="progress-fraction" id="progressFraction">0 of 0 tasks</span>
        </div>

        <!-- Animated progress bar -->
        <div class="progress-bar-track" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100" aria-label="Daily progress">
          <div class="progress-bar-fill" id="progressBarFill"></div>
        </div>

        <!-- Motivational label -->
        <p class="progress-label" id="progressLabel">Add tasks to get started! ✨</p>
      </section>

    </div><!-- end bottom-row -->

  </div><!-- end dashboard -->

  <script src="js/app.js"></script>
</body>
</html>
